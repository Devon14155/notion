name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
          } catch {
            console.log("::warning title=Dependency audit::Could not read npm audit output; verify registry connectivity.");
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities;
          if (!counts) {
            console.log("::warning title=Dependency audit::npm audit did not return vulnerability metadata.");
            process.exit(0);
          }
          const vulnerable = Object.entries(report.vulnerabilities || {});
          console.log("Dependency audit counts:", JSON.stringify(counts));
          for (const [name, item] of vulnerable) {
            const via = (item.via || []).filter((entry) => typeof entry === "object").map((entry) => entry.title).filter(Boolean);
            console.log(name + " | severity=" + item.severity + " | direct=" + item.isDirect + " | fixAvailable=" + JSON.stringify(item.fixAvailable) + (via.length ? " | advisories=" + via.join("; ") : ""));
          }
          const summary = [
            "## Dependency audit",
            "",
            "| Severity | Count |",
            "|---|---:|",
            "| Critical | " + (counts.critical || 0) + " |",
            "| High | " + (counts.high || 0) + " |",
            "| Moderate | " + (counts.moderate || 0) + " |",
            "| Low | " + (counts.low || 0) + " |",
            "",
            "This report is currently informational while dependency upgrades are triaged.",
            "",
            vulnerable.length ? "| Package | Severity | Direct | Fix available |\n|---|---|---:|---|\n" + vulnerable.map(([name, item]) => "| " + name + " | " + item.severity + " | " + item.isDirect + " | " + JSON.stringify(item.fixAvailable) + " |").join("\n") : "No vulnerable packages were reported."
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
          if ((counts.high || 0) + (counts.critical || 0) > 0) {
            console.log("::warning title=Dependency audit::High or critical dependency advisories require remediation.");
          }
          NODE
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
